name: Update CS2 Calendar
on:
  schedule:
    - cron: '0 */12 * * *' # Runs automatically every 12 hours
  workflow_dispatch: # Gives you a manual "Run Now" button

permissions:
  contents: write

# 🚀 THIS LINE BANS THE WARNING AND FORCES NODE.JS 24 DEFAULT
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install requests icalendar
    - run: python generate_calendar.py
      env:
        PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
    - run: |
        git config --global user.name "Actions Bot"
        git config --global user.email "actions@github.com"
        git add cs2_upcoming_matches.ics
        git commit -m "Calendar Sync" || exit 0
        git push
